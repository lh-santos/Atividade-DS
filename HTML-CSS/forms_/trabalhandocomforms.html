<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com forms</title>
</head>
<body>
    <h1>Cadastrar funcionario</h1>
    <form action="#">
        <h3>Preenchar os dados do funcionario</h3> 

        <label for="nome">Nome:</label> <br>
        <input type="text" name="nome" id="nome"> <br>

        <label for="">Idade:</label> <br>
        <input type="text" name="idade" id="idade"> <br>

        <label for="dt_nasce">Data de nascimento:</label> <br>
        <input type="date" name="dt_nasce" id="dt_nasce"> <br>

        <label for="email">E-mail:</label> <br>
        <input type="email" name="email" id="email"> <br>

        <label for="senha">senha:</label> <br>
        <input type="password" name="senha" id="senha"> <br>

        <label for="idiomas">Idiomas:</label> <br>
        <input type="checkbox" name="idiomas" id="Ingles"> Ingles
        <input type="checkbox" name="idiomas" id="Portugês-BR"> Portugês-BR
        <input type="checkbox" name="idiomas" id="Espanhou"> Espanhou <br>
        
        <label for="sexo">Sexo:</label> <br>

        <input type="checkbox" name="sexo" id="Feminino">
            <label for="sexo">Feminino</label>
        <input type="checkbox" name="sexo" id="Masculino">
            <label for="sexo">Masculino</label>
    </form>
</body>
</html>
