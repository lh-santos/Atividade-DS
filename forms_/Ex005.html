<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

<body>

    <header class="headercadastro" id="headercadastro">

    <main class="conteudo">

        <form action="#" class="cadastro">

            <h2>Cadastre-se para receber novidades e vagas disponiveis</h2>

            <h4>Informe seus dados</h4>

            <label for="nome">Nome</label> <br>

            <label for="email">E-mail</label> <br>
            <input type="email" name="email" id="email"> <br>

            <label for="senha">Senha</label>  <br>
            <input type="password" name="senha" id="senha"> <br>

            <label for="região">Região</label> <br>
            <select name="região" id="região">
                <option>Nordeste</option>
                <option>Norte</option>
                <option>Centro oeste</option>
                <option>Suldeste</option>
                <option>Sul</option>
            </select>

        </form>

        <a href="ex004.html" id="bt"><button>Enviar</button></a>

    <footer class="rodape">
        <p>Bem senhora e senhores, é isso.</p>
